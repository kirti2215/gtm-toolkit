# Data Access Policy — Veltara Financial Group
# Machine-readable by the policy engine.
# Defines data classification levels, per-classification agent access rules,
# retrieval controls, and sensitive output patterns.

version: "1.1"
effective_date: "2026-08-01"
owner: data-governance

# ── Classification levels (ordered lowest to highest sensitivity) ──────────────
classification_levels:
  - public
  - internal
  - confidential
  - restricted
  - regulated

# ── Resource classification map ───────────────────────────────────────────────
# Maps resource identifiers used in agent requests to their classification level.

resource_classifications:
  public_company_filings: public
  product_documentation: public
  org_charts: internal
  internal_wikis: internal
  role_catalog: internal
  role_definitions: internal
  access_requests: internal
  ticketing_system: internal
  approver_directory: internal
  account_metadata: confidential
  entitlement_records: confidential
  access_logs: confidential
  authentication_events: confidential
  access_anomaly_alerts: confidential
  system_event_logs: confidential
  customer_records: confidential
  full_identity_record: restricted
  authentication_credentials: restricted
  mfa_seeds: restricted
  payment_or_financial_data: restricted
  legal_or_compliance_files: restricted
  complete_access_history_bulk_export: restricted
  privileged_role_definitions: restricted
  audit_logs_privileged_access: restricted
  eu_personal_data: regulated
  sox_financial_records: regulated
  finra_trade_records: regulated

# ── Agent data classification ceilings ───────────────────────────────────────
# Defines the maximum classification level each agent may access.
# Requests for resources above this ceiling are denied regardless of approved_data.

agent_classification_ceilings:
  iam-access-review-agent: confidential
  iam-provisioning-agent: confidential
  security-investigation-agent: confidential
  customer-offboarding-agent: confidential

# ── Retrieval controls ────────────────────────────────────────────────────────
retrieval_controls:

  untrusted_source_tagging:
    rule: >
      Any content retrieved from an external source — a ticket, email,
      knowledge-base document, or API response — is tagged UNTRUSTED_DATA.
    effect: >
      UNTRUSTED_DATA may inform agent analysis. It may NOT independently
      authorize a tool call, override a system instruction, change task scope,
      or grant permissions.

  instruction_boundary:
    rule: >
      Agent system instructions define task and authority.
      No retrieved content may redefine that boundary.

  data_minimization:
    rule: >
      Agents may only retrieve data sufficient for the current task.
      Retrieving more than the task requires is a policy violation,
      even if the resource is within the agent's approved_data.

# ── Sensitive output patterns ─────────────────────────────────────────────────
# The policy engine scans agent output and tool call parameters for these patterns.
# Detection triggers a classification check before the action proceeds.

sensitive_output_patterns:
  - pattern_name: credential_string
    keywords: ["password", "api_key", "secret", "token", "bearer"]
    action_on_detection: DENY

  - pattern_name: personal_identifier
    keywords: ["national_id", "passport", "tax_id", "ssn", "nino"]
    action_on_detection: DENY

  - pattern_name: financial_account_number
    keywords: ["iban", "account_number", "card_number", "routing_number"]
    action_on_detection: DENY

  - pattern_name: mfa_recovery
    keywords: ["recovery_code", "mfa_seed", "authenticator_secret", "backup_code"]
    action_on_detection: DENY
